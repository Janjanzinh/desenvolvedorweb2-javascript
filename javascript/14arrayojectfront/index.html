<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <header>
        <h1>Javascript básico</h1>
        <button id="menu-btn" class="hamburger">
            ☰

            <a href="#" onclick="mostrarTela('array')">Array</a>
            <a href="#" onclick="mostrarTela('objeto')">objeto</a>

    </header>

    <main>
        <!--TELA ARRAY-->
        <section id="array" class="tela ativa">

            <p> Array armazenam vários valores em uma única variavel.</p>

            <button onclick="executarArray()">
                executar exemplos de array


            </button>
            <div id="resultado-array" class="resultado"></div>

        </section>

        <!--TELA OBJETO-->
        <section id="objeto" class="tela">
            <h2>trabalhando com Objetos</h2>

            <p>Objetos armazenam dados em pares chave e valor</p>

            <button onclick="executarObjeto()">
                executar exemplos de objeto
            </button>

            <div id="resultado-objeto" class="resultado"></div>
        </section>
    </main>
    <script src="./js/script.js"></script>

</html>
