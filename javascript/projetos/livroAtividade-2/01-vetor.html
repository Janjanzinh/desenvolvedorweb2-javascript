<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de vetor</title>
</head>
<body>
    <h1>Exemplo de vetor</h1>
    <p id="teste1">conteudo do vetor 1: </p>
    <p id="teste2">conteudo do vetor 2: </p>
    <p id="teste3">Segunda posição do vetor 1: </p>
    <p id="teste4">terceira posição do vetor 2: </p>

    <script>
        //Criando os vetores
        var cores1 = ['verde', 'amarelo', 'azul', 'branco'];
        var cores2 = new Array('laranja', 'vermelho', 'preto', 'cinza');

        // Mostrar os contéudos dos vetores
        document.getElementById('teste1').innerHTML += cores1;
        document.getElementById('teste2').innerHTML += cores1;
        document.getElementById('teste3').innerHTML += cores1[1];
        document.getElementById('teste4').innerHTML += cores2[1];

    </script>
</body>

</html>
